<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>RAYE Concert</title>
  <style>
    @font-face {
      font-family: 'IvyJournal';
      src: url('IvyJournal.otf') format('opentype'),
           url('IvyJournal.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    body {
      font-family: 'IvyJournal', serif;
      background-color: #1a1a1a;
      background-image: url('this_music_may_contain_hope.jpg');
      background-position: right center;
      background-size: auto 100%;
      background-repeat: no-repeat;
      height: 100vh;
      margin: 0;
      position: relative;
      color: #fff;
    }

    .container {
      position: absolute;
      top: 10px;
      right: 5%;
      font-family: 'IvyJournal', serif;
      font-size: 2.5rem;
      letter-spacing: 0.04em;
      line-height: 1.2;
      color: #fff;
      background: linear-gradient(
        180deg,
        #8caef9 10%,
        #8caef9 90%
      );
      width: 260px;
      min-height: 260px;
      padding: 28px;
      border-radius: 12px;
      box-shadow:
        0 24px 48px rgba(0, 0, 0, 0.12),
        0 0 0 1px rgba(0, 0, 0, 0.06);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    #title {
      font-size: 2.2rem;
      margin: 0;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
    }

    #countdown {
      font-size: 2.1rem;
      letter-spacing: 0.06em;
      margin: 15px 0 0;
      color: #fff;
    }

    .label {
      margin-top: 12px;
      font-size: 1.1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
    }

    .divider {
      width: 60%;
      height: 1px;
      margin: 20px 0;
      background: linear-gradient(
        to right,
        transparent,
        rgba(255, 255, 255, 0.5),
        transparent
      );
    }

    /* On phones: show left side of image (the woman) */
    @media (max-width: 768px) {
      body {
        background-position: left center;
        background-size: cover;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="title">RAYE</div>
    <div id="label" class="label">THIS CONCERT MAY CONTAIN FUN</div>
    <div id="divider" class="divider"></div>
    <div id="countdown">Lade Countdown…</div>
  </div>
  

  <script>
    const targetDate = new Date("2026-02-07T02:05:00");

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.getElementById("countdown").innerText =
          "Los geeeeht's 😍";
        document.getElementById("countdown").style.whiteSpace = "pre-line";

        // Alles ausblenden
        document.getElementById("divider").style.display = "none";

        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("countdown").innerText =
        `${days}d  ${hours}h  ${minutes}m  ${seconds}s`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
